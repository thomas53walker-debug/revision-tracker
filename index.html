const STARTER_TOPICS = {

const pad2 = (n) => String(n).padStart(2, "0");
const todayStr = (dt = new Date()) => `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
const startOfWeekStr = (dt = new Date()) => {
  const d = new Date(dt);
  const day = d.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  d.setDate(d.getDate() + diff);
  return todayStr(d);
};

const defaultData = () => ({
  subjects: [], sessions: [],
  goals: { dailyMinutes: 120, weeklyMinutes: 600, subjectWeekly: {} },
  tasks: [], mistakes: [],
});

const normalize = (raw) => {
  const base = defaultData();
  if (!raw) return base;
  return {
    subjects: (raw.subjects || []).map((s) => ({ ...s, topics: s.topics || [] })),
    sessions: raw.sessions || [],
    goals: { ...base.goals, ...(raw.goals || {}) },
    tasks: raw.tasks || [],
    mistakes: raw.mistakes || [],
  };
};

function formatElapsed(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = Math.floor(totalSeconds % 60);
  if (h > 0) return `${h}:${pad2(m)}:${pad2(s)}`;
  return `${pad2(m)}:${pad2(s)}`;
}
function formatMinutes(mins) {
  const rounded = Math.round(mins);
  if (rounded < 60) return `${rounded}m`;
  const h = Math.floor(rounded / 60);
  const m = rounded % 60;
  return m > 0 ? `${h}h ${m}m` : `${h}h`;
}

function ProgressBar({ value, max, color }) {
  const pct = max > 0 ? Math.min(100, (value / max) * 100) : 0;
  return (
    <div className="h-2 w-full rounded-full overflow-hidden" style={{ background: C.track }}>
      <div className="h-full rounded-full transition-all duration-500" style={{ width: `${pct}%`, background: color }} />
    </div>
  );
}
function StarRow({ value, onChange }) {
  return (
    <div className="flex gap-1 justify-center text-2xl leading-none">
      {[1, 2, 3, 4, 5].map((n) => (
        <button key={n} onClick={() => onChange(n)} style={{ color: n <= value ? C.gold : C.track }}>★</button>
      ))}
    </div>
  );
}
function MiniStars({ value }) {
  if (!value) return null;
  return <span style={{ color: C.gold, fontSize: 10 }}>{"★".repeat(value)}<span style={{ color: C.track }}>{"★".repeat(5 - value)}</span></span>;
}
function BarList({ data }) {
  const max = Math.max(1, ...data.map((d) => d.value));
  return (
    <div className="space-y-2">
      {data.map((d, i) => (
        <div key={i}>
          <div className="flex justify-between mb-0.5" style={{ fontSize: 12 }}>
            <span>{d.label}</span><span style={{ color: C.inkSoft }}>{formatMinutes(d.value)}</span>
          </div>
          <div className="h-3 rounded-full overflow-hidden" style={{ background: C.track }}>
            <div className="h-full rounded-full" style={{ width: `${(d.value / max) * 100}%`, background: d.color }} />
          </div>
        </div>
      ))}
    </div>
  );
}
function SimplePie({ data, size = 150 }) {
  const total = data.reduce((a, d) => a + d.value, 0);
  let acc = 0;
  const stops = total > 0 ? data.map((d) => {
    const start = (acc / total) * 100;
    acc += d.value;
    return `${d.color} ${start}% ${(acc / total) * 100}%`;
  }).join(", ") : `${C.track} 0% 100%`;
  return (
    <div className="flex items-center gap-4 flex-wrap">
      <div style={{ width: size, height: size, borderRadius: "50%", background: `conic-gradient(${stops})`, flexShrink: 0 }} />
      <div className="space-y-1">
        {data.map((d, i) => (
          <div key={i} className="flex items-center gap-2" style={{ fontSize: 12 }}>
            <span style={{ width: 9, height: 9, borderRadius: 9, background: d.color, display: "inline-block" }} />
            {d.label} — {formatMinutes(d.value)}
          </div>
        ))}
      </div>
    </div>
  );
}

const TABS = [
  { id: "timer", label: "Timer", icon: "▶" },
  { id: "tasks", label: "Tasks", icon: "☑" },
  { id: "calendar", label: "Calendar", icon: "📅" },
  { id: "mistakes", label: "Mistakes", icon: "⚠" },
  { id: "topics", label: "Topics", icon: "📘" },
  { id: "stats", label: "Stats", icon: "📊" },
  { id: "goals", label: "Goals", icon: "🎯" },
];

function App() {
  const [syncCode, setSyncCode] = useState(() => localStorage.getItem("revision-sync-code") || "");
  const [codeInput, setCodeInput] = useState("");

  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [saveErrorDetail, setSaveErrorDetail] = useState("");
  const [unsaved, setUnsaved] = useState(null);
  const [configError, setConfigError] = useState(!sb);

  const [activeTab, setActiveTab] = useState("timer");
  const [activeSubjectId, setActiveSubjectId] = useState(null);
  const [mode, setMode] = useState("learning");
  const [timerStart, setTimerStart] = useState(null);
  const [elapsed, setElapsed] = useState(0);
  const [pendingSession, setPendingSession] = useState(null);
  const [pendingRating, setPendingRating] = useState(0);
  const intervalRef = useRef(null);
  const timerStartRef = useRef(null);
  const pendingSessionRef = useRef(null);

  const [newSubjectName, setNewSubjectName] = useState("");
  const [showAddSubject, setShowAddSubject] = useState(false);
  const [month, setMonth] = useState(() => { const d = new Date(); d.setDate(1); return d; });
  const [selectedDay, setSelectedDay] = useState(todayStr());
  const [editingGoal, setEditingGoal] = useState(null);
  const [goalInput, setGoalInput] = useState("");
  const [newTaskTitle, setNewTaskTitle] = useState("");
  const [newTaskFreq, setNewTaskFreq] = useState("daily");
  const [mistakeSubjectId, setMistakeSubjectId] = useState(null);
  const [mistakeTopic, setMistakeTopic] = useState("");
  const [mistakeDesc, setMistakeDesc] = useState("");
  const [topicsSubjectId, setTopicsSubjectId] = useState(null);
  const [newTopicName, setNewTopicName] = useState("");
  const [showSyncInfo, setShowSyncInfo] = useState(false);

  const loadFromBackend = async (code) => {
    if (!sb || !code) return;
    try {
      const { data: row, error } = await sb.from("revision_data").select("data").eq("sync_code", code).maybeSingle();
      if (error) throw error;
      setData(row ? normalize(row.data) : defaultData());
    } catch (e) {
      setData((prev) => prev || defaultData());
    }
    setLoaded(true);
  };

  useEffect(() => {
    if (syncCode) loadFromBackend(syncCode);
    const onVisible = () => {
      if (document.visibilityState !== "visible") return;
      if (timerStartRef.current || pendingSessionRef.current) return;
      if (syncCode) loadFromBackend(syncCode);
    };
    document.addEventListener("visibilitychange", onVisible);
    window.addEventListener("focus", onVisible);
    return () => {
      document.removeEventListener("visibilitychange", onVisible);
      window.removeEventListener("focus", onVisible);
    };
    // eslint-disable-next-line
  }, [syncCode]);

  useEffect(() => {
    timerStartRef.current = timerStart;
    if (timerStart) {
      intervalRef.current = setInterval(() => setElapsed(Math.floor((Date.now() - timerStart) / 1000)), 1000);
    }
    return () => clearInterval(intervalRef.current);
  }, [timerStart]);
  useEffect(() => { pendingSessionRef.current = pendingSession; }, [pendingSession]);

  const confirmCode = () => {
    const code = codeInput.trim();
    if (!code) return;
    localStorage.setItem("revision-sync-code", code);
    setSyncCode(code);
    setLoaded(false);
  };
  const changeCode = () => {
    localStorage.removeItem("revision-sync-code");
    setSyncCode("");
    setData(null);
    setLoaded(false);
    setShowSyncInfo(false);
  };

  const persist = async (next, attempt = 0) => {
    setData(next);
    setUnsaved(next);
    if (!sb || !syncCode) { setSaveError(true); setSaveErrorDetail("Not connected to Supabase."); return; }
    try {
      const { error } = await sb.from("revision_data").upsert({ sync_code: syncCode, data: next, updated_at: new Date().toISOString() });
      if (error) throw error;
      setSaveError(false);
      setSaveErrorDetail("");
      setUnsaved(null);
    } catch (e) {
      if (attempt < 3) {
        setTimeout(() => persist(next, attempt + 1), 700 * (attempt + 1));
      } else {
        setSaveError(true);
        setSaveErrorDetail((e && (e.message || e.error_description || e.hint)) || String(e));
      }
    }
  };
  const retrySave = () => { if (unsaved) persist(unsaved); };

  const d = normalize(data);
  const subjectById = (id) => d.subjects.find((s) => s.id === id);

  const addSubject = () => {
    const name = newSubjectName.trim();
    if (!name) return;
    const id = "sub_" + Date.now();
    const color = SUBJECT_COLORS[d.subjects.length % SUBJECT_COLORS.length];
    persist({ ...d, subjects: [...d.subjects, { id, name, color, topics: [] }] });
    setNewSubjectName(""); setShowAddSubject(false); setActiveSubjectId(id);
  };
  const startTimer = (subjectId) => { setActiveSubjectId(subjectId); setTimerStart(Date.now()); setElapsed(0); };
  const stopTimer = () => {
    if (!timerStart || !activeSubjectId) return;
    const seconds = Math.max(1, Math.floor((Date.now() - timerStart) / 1000));
    setPendingSession({ subjectId: activeSubjectId, mode, minutes: seconds / 60 });
    setPendingRating(0); setTimerStart(null); setElapsed(0);
  };
  const confirmSession = (rating) => {
    if (!pendingSession) return;
    const session = { id: "ses_" + Date.now(), subjectId: pendingSession.subjectId, date: todayStr(), minutes: pendingSession.minutes, mode: pendingSession.mode, rating: rating || null, timestamp: Date.now() };
    persist({ ...d, sessions: [...d.sessions, session] });
    setPendingSession(null); setPendingRating(0);
  };
  const deleteSession = (id) => persist({ ...d, sessions: d.sessions.filter((s) => s.id !== id) });

  const addTask = () => {
    const title = newTaskTitle.trim();
    if (!title) return;
    persist({ ...d, tasks: [...d.tasks, { id: "task_" + Date.now(), title, frequency: newTaskFreq, completions: [], done: false }] });
    setNewTaskTitle("");
  };
  const toggleTask = (task) => {
    let next;
    if (task.frequency === "once") next = { ...task, done: !task.done };
    else {
      const key = task.frequency === "daily" ? todayStr() : startOfWeekStr();
      const has = task.completions.includes(key);
      next = { ...task, completions: has ? task.completions.filter((k) => k !== key) : [...task.completions, key] };
    }
    persist({ ...d, tasks: d.tasks.map((t) => (t.id === task.id ? next : t)) });
  };
  const deleteTask = (id) => persist({ ...d, tasks: d.tasks.filter((t) => t.id !== id) });
  const isTaskDone = (task) => {
    if (task.frequency === "once") return task.done;
    const key = task.frequency === "daily" ? todayStr() : startOfWeekStr();
    return task.completions.includes(key);
  };

  const addMistake = () => {
    const description = mistakeDesc.trim();
    if (!mistakeSubjectId || !description) return;
    persist({ ...d, mistakes: [...d.mistakes, { id: "mis_" + Date.now(), subjectId: mistakeSubjectId, topic: mistakeTopic.trim(), description, date: todayStr(), resolved: false }] });
    setMistakeTopic(""); setMistakeDesc("");
  };
  const toggleMistakeResolved = (id) => persist({ ...d, mistakes: d.mistakes.map((m) => (m.id === id ? { ...m, resolved: !m.resolved } : m)) });
  const deleteMistake = (id) => persist({ ...d, mistakes: d.mistakes.filter((m) => m.id !== id) });

  const setTopicStatus = (subjectId, topicId, status) => persist({ ...d, subjects: d.subjects.map((s) => s.id === subjectId ? { ...s, topics: s.topics.map((t) => t.id === topicId ? { ...t, status } : t) } : s) });
  const addTopic = (subjectId) => {
    const name = newTopicName.trim();
    if (!name) return;
    persist({ ...d, subjects: d.subjects.map((s) => s.id === subjectId ? { ...s, topics: [...s.topics, { id: "top_" + Date.now(), name, status: "red" }] } : s) });
    setNewTopicName("");
  };
  const deleteTopic = (subjectId, topicId) => persist({ ...d, subjects: d.subjects.map((s) => s.id === subjectId ? { ...s, topics: s.topics.filter((t) => t.id !== topicId) } : s) });
  const loadStarterTopics = (subjectId, key) => {
    const starter = STARTER_TOPICS[key];
    if (!starter) return;
    persist({ ...d, subjects: d.subjects.map((s) => {
      if (s.id !== subjectId) return s;
      const existing = new Set(s.topics.map((t) => t.name.toLowerCase()));
      const toAdd = starter.topics.filter((n) => !existing.has(n.toLowerCase())).map((n) => ({ id: "top_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7), name: n, status: "red" }));
      return { ...s, topics: [...s.topics, ...toAdd] };
    })});
  };
  const setupALevels = () => {
    const mapping = [
      { match: /math/i, name: "Maths", key: "maths_mei" },
      { match: /phys/i, name: "Physics", key: "physics_aqa" },
      { match: /comput/i, name: "Computer Science", key: "cs_ocr" },
    ];
    let subjects = [...d.subjects];
    let firstId = null;
    for (const m of mapping) {
      let subject = subjects.find((s) => m.match.test(s.name));
      if (!subject) {
        subject = { id: "sub_" + Date.now() + "_" + Math.random().toString(36).slice(2, 6), name: m.name, color: SUBJECT_COLORS[subjects.length % SUBJECT_COLORS.length], topics: [] };
        subjects = [...subjects, subject];
      }
      if (!firstId) firstId = subject.id;
      const starter = STARTER_TOPICS[m.key];
      const existing = new Set(subject.topics.map((t) => t.name.toLowerCase()));
      const toAdd = starter.topics.filter((n) => !existing.has(n.toLowerCase())).map((n) => ({ id: "top_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7), name: n, status: "red" }));
      subjects = subjects.map((s) => s.id === subject.id ? { ...s, topics: [...s.topics, ...toAdd] } : s);
    }
    persist({ ...d, subjects });
    setTopicsSubjectId(firstId);
  };

  const sessionsByDate = useMemo(() => {
    const map = {};
    for (const s of d.sessions) { if (!map[s.date]) map[s.date] = []; map[s.date].push(s); }
    return map;
  }, [d.sessions]);
  const todayTotal = (sessionsByDate[todayStr()] || []).reduce((a, s) => a + s.minutes, 0);
  const last7Dates = useMemo(() => {
    const arr = [];
    for (let i = 0; i < 7; i++) { const dt = new Date(); dt.setDate(dt.getDate() - i); arr.push(todayStr(dt)); }
    return arr;
    // eslint-disable-next-line
  }, [d.sessions.length]);
  const weekTotal = last7Dates.reduce((sum, dt) => sum + (sessionsByDate[dt] || []).reduce((a, s) => a + s.minutes, 0), 0);
  const subjectWeekTotals = useMemo(() => {
    const totals = {};
    for (const dt of last7Dates) for (const s of sessionsByDate[dt] || []) totals[s.subjectId] = (totals[s.subjectId] || 0) + s.minutes;
    return totals;
  }, [sessionsByDate, last7Dates]);
  const subjectAllTimeTotals = useMemo(() => {
    const totals = {};
    for (const s of d.sessions) totals[s.subjectId] = (totals[s.subjectId] || 0) + s.minutes;
    return totals;
  }, [d.sessions]);
  const modeTotals = useMemo(() => {
    const totals = { learning: 0, questions: 0 };
    for (const s of d.sessions) totals[s.mode === "questions" ? "questions" : "learning"] += s.minutes;
    return totals;
  }, [d.sessions]);
  const streak = useMemo(() => {
    let count = 0, dt = new Date();
    if (!sessionsByDate[todayStr(dt)]) dt.setDate(dt.getDate() - 1);
    while (sessionsByDate[todayStr(dt)]) { count++; dt.setDate(dt.getDate() - 1); }
    return count;
  }, [sessionsByDate]);
  const trendData = useMemo(() => {
    const arr = [];
    for (let i = 13; i >= 0; i--) {
      const dt = new Date(); dt.setDate(dt.getDate() - i);
      const ds = todayStr(dt);
      arr.push({ label: dt.toLocaleDateString(undefined, { weekday: "short" }), value: Math.round((sessionsByDate[ds] || []).reduce((a, s) => a + s.minutes, 0)), color: C.accent });
    }
    return arr;
  }, [sessionsByDate]);
  const subjectChartData = d.subjects.map((s) => ({ label: s.name, value: Math.round(subjectAllTimeTotals[s.id] || 0), color: s.color })).filter((s) => s.value > 0).sort((a, b) => b.value - a.value);
  const modePieData = [
    { label: "Learning", value: Math.round(modeTotals.learning), color: C.accent },
    { label: "Questions", value: Math.round(modeTotals.questions), color: C.gold },
  ].filter((m) => m.value > 0);

  const calendarDays = useMemo(() => {
    const year = month.getFullYear(), mo = month.getMonth();
    const startOffset = new Date(year, mo, 1).getDay();
    const daysInMonth = new Date(year, mo + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startOffset; i++) cells.push(null);
    for (let dd = 1; dd <= daysInMonth; dd++) cells.push(new Date(year, mo, dd));
    return cells;
  }, [month]);
  const maxDayMinutes = Math.max(1, ...Object.values(sessionsByDate).map((l) => l.reduce((a, s) => a + s.minutes, 0)), 1);
  const intensityStyle = (mins) => !mins || mins <= 0 ? {} : { background: `rgba(61,90,76,${0.15 + Math.min(1, mins / maxDayMinutes) * 0.65})` };

  const saveGoal = (key) => {
    const val = parseFloat(goalInput);
    if (!isNaN(val) && val > 0) {
      let next;
      if (key === "daily") next = { ...d, goals: { ...d.goals, dailyMinutes: val } };
      else if (key === "weekly") next = { ...d, goals: { ...d.goals, weeklyMinutes: val } };
      else next = { ...d, goals: { ...d.goals, subjectWeekly: { ...d.goals.subjectWeekly, [key]: val } } };
      persist(next);
    }
    setEditingGoal(null); setGoalInput("");
  };

  const selectedDaySessions = sessionsByDate[selectedDay] || [];
  const monthLabel = month.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  const running = !!timerStart;
  const inputStyle = { border: `1px solid ${C.muted}`, outline: "none" };
  const card = { background: "#fff", border: `1px solid ${C.border}` };
  const activeTopicsSubject = subjectById(topicsSubjectId) || d.subjects[0] || null;
  const topicCounts = useMemo(() => {
    if (!activeTopicsSubject) return { red: 0, amber: 0, green: 0, total: 0 };
    const counts = { red: 0, amber: 0, green: 0 };
    for (const t of activeTopicsSubject.topics) counts[t.status] = (counts[t.status] || 0) + 1;
    return { ...counts, total: activeTopicsSubject.topics.length };
  }, [activeTopicsSubject]);

        )}

        {activeTab === "goals" && (
          <div className="rounded-2xl p-5 space-y-4" style={card}>
            <h2 style={{ fontFamily: SERIF, fontSize: 18 }} className="font-semibold">Goals</h2>
            {[
              { key: "daily", label: "Today", value: todayTotal, target: d.goals.dailyMinutes, color: C.accent },
              { key: "weekly", label: "This week", value: weekTotal, target: d.goals.weeklyMinutes, color: C.gold },
            ].map((g) => (
              <div key={g.key}>
                <div className="flex justify-between items-baseline mb-1" style={{ fontSize: 13 }}>
                  <span style={{ color: C.inkSoft }}>{g.label}</span>
                  <span className="flex items-center gap-1.5">
                    <span className="font-medium">{formatMinutes(g.value)} / {formatMinutes(g.target)}</span>
                    <button onClick={() => { setEditingGoal(g.key); setGoalInput(String(g.target)); }} style={{ color: C.muted }}>✎</button>
                  </span>
                </div>
                {editingGoal === g.key ? (
                  <div className="flex gap-1.5">
                    <input autoFocus type="number" value={goalInput} onChange={(e) => setGoalInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") saveGoal(g.key); if (e.key === "Escape") setEditingGoal(null); }} className="rounded-md w-24" style={{ ...inputStyle, fontSize: 13, padding: "4px 8px" }} />
                    <button onClick={() => saveGoal(g.key)} className="rounded-md text-white" style={{ fontSize: 13, padding: "4px 8px", background: C.accent }}>Save</button>
                  </div>
                ) : <ProgressBar value={g.value} max={g.target} color={g.color} />}
              </div>
            ))}
            {d.subjects.length > 0 && (
              <div className="pt-2 space-y-3" style={{ borderTop: `1px solid ${C.borderFaint}` }}>
                <p style={{ fontSize: 12, color: C.muted }} className="uppercase tracking-wide">Weekly balance by subject</p>
                {d.subjects.map((s) => {
                  const target = d.goals.subjectWeekly[s.id] || 180;
                  const value = subjectWeekTotals[s.id] || 0;
                  return (
                    <div key={s.id}>
                      <div className="flex justify-between items-baseline mb-1" style={{ fontSize: 13 }}>
                        <span style={{ color: s.color }} className="font-medium">{s.name}</span>
                        <span className="flex items-center gap-1.5" style={{ color: C.inkSoft }}>{formatMinutes(value)} / {formatMinutes(target)}<button onClick={() => { setEditingGoal(s.id); setGoalInput(String(target)); }} style={{ color: C.muted }}>✎</button></span>
                      </div>
                      {editingGoal === s.id ? (
                        <div className="flex gap-1.5">
                          <input autoFocus type="number" value={goalInput} onChange={(e) => setGoalInput(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter") saveGoal(s.id); if (e.key === "Escape") setEditingGoal(null); }} className="rounded-md w-24" style={{ ...inputStyle, fontSize: 13, padding: "4px 8px" }} />
                          <button onClick={() => saveGoal(s.id)} className="rounded-md text-white" style={{ fontSize: 13, padding: "4px 8px", background: C.accent }}>Save</button>
                        </div>
                      ) : <ProgressBar value={value} max={target} color={s.color} />}
                    </div>
                  );
                })}
              </div>
            )}
            <div className="pt-3" style={{ borderTop: `1px solid ${C.borderFaint}` }}>
              <button onClick={() => setShowSyncInfo((v) => !v)} style={{ fontSize: 12, color: C.muted }}>Sync settings</button>
              {showSyncInfo && (
                <div className="mt-2 rounded-lg p-3" style={{ background: C.panel, fontSize: 12 }}>
                  <p style={{ color: C.inkSoft }} className="mb-2">Your sync code (enter this exact code on your other device):</p>
                  <code className="rounded px-2 py-1 block mb-2" style={{ background: "#fff", border: `1px solid ${C.border}` }}>{syncCode}</code>
                  <button onClick={changeCode} style={{ color: C.error }}>Use a different code</button>
                </div>
              )}
            </div>
          </div>
        )}
      </div>

      <div className="fixed bottom-0 left-0 right-0 flex items-stretch z-20 overflow-x-auto" style={{ background: "#fff", borderTop: `1px solid ${C.border}`, paddingTop: 6, paddingBottom: 6 }}>
        {TABS.map((t) => {
          const isActive = activeTab === t.id;
          return (
            <button key={t.id} onClick={() => setActiveTab(t.id)} className="flex flex-col items-center gap-0.5 shrink-0" style={{ color: isActive ? C.accent : C.muted, minWidth: 62, padding: "2px 4px" }}>
              <span style={{ fontSize: 17 }}>{t.icon}</span>
              <span style={{ fontSize: 10.5, fontWeight: isActive ? 600 : 400, whiteSpace: "nowrap" }}>{t.label}</span>
            </button>
          );
        })}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<script>
  // Manually transform + run the JSX above with the classic runtime.
  // (Babel's automatic script-tag scanning defaults to the "automatic" JSX
  // runtime, which injects an ES `import` statement that a plain <script>
  // can't execute — this avoids that entirely.)
  var src = document.getElementById("app-src").textContent;
  var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
  var s = document.createElement("script");
  s.text = out;
  document.body.appendChild(s);
</script>
</body>
</html>
